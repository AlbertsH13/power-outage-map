services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: outage-map-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - public-build:/var/www/html/public/build
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - outage-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - public-build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - outage-net

  queue:
    image: outage-map-app:latest
    pull_policy: never
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - outage-net

  scheduler:
    image: outage-map-app:latest
    pull_policy: never
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - outage-net

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-outage_map}
      MYSQL_USER: ${DB_USERNAME:-outage_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - outage-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - outage-net

volumes:
  mysql-data:
  redis-data:
  public-build:
  app-storage:

networks:
  outage-net:
    driver: bridge